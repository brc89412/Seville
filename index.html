<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1330">
<title>Sevilla, 28 to 30 September 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --night:#0A1330; --deep:#0E1B42; --panel:#132250; --panel2:#1A2D62; --line:#28407F;
  --cobalt:#4A7DE0; --cobalt-soft:#93B3F8; --albero:#E4AA3C; --almagre:#D6573E; --coral:#F28B74;
  --cal:#F4EFE3; --dim:#B4BFDD; --ok:#86C28A; --tile-ink:#123A8C; --rose:#F0A6C0;
  --serif:'Young Serif',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050B1F}
body{font-family:var(--sans);color:var(--cal);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--albero);outline-offset:2px;border-radius:6px}

#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--night);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px #16264f,0 30px 80px #000a}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
.screen{padding:0 18px 28px;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* tab bar */
nav{display:flex;background:rgba(10,19,48,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:11px;padding:6px 0 2px;position:relative}
nav button svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--albero)}
nav .tabstar{position:absolute;top:-9px;left:50%;width:14px;height:14px;transform:translateX(-50%);fill:var(--albero)}

/* type */
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
h2{font-size:24px;line-height:1.15;margin:26px 0 10px}
h3{font-size:18px;line-height:1.25}
.sub{color:var(--dim);font-size:13.5px}
.tnum{font-variant-numeric:tabular-nums}
p{margin:0 0 10px}

/* splash */
#splash{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#17306e 0%,var(--night) 60%);display:flex;flex-direction:column;justify-content:center;padding:28px;transition:opacity .5s,transform .5s}
#splash::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--tile);background-size:64px 64px;opacity:0;animation:tiles 1.6s .1s ease-out forwards;mask-image:radial-gradient(circle at 50% 42%,#000 10%,transparent 72%);-webkit-mask-image:radial-gradient(circle at 50% 42%,#000 10%,transparent 72%)}
@keyframes tiles{to{opacity:.55}}
#splash.out{opacity:0;transform:scale(1.03);pointer-events:none}
.plaque{position:relative;background:var(--cal);color:var(--tile-ink);border-radius:14px;padding:26px 22px 20px;text-align:center;box-shadow:0 0 0 3px var(--cal),0 0 0 5px var(--tile-ink),0 22px 50px #0009}
.plaque::before{content:"";position:absolute;inset:8px;border:1.5px solid var(--tile-ink);border-radius:8px;pointer-events:none}
.plaque h1{font-size:60px;line-height:1;letter-spacing:.01em}
.plaque .ln{font-size:14px;font-weight:600;margin-top:8px}
.plaque .ln2{font-size:13px;opacity:.8;margin-top:2px}
.cta{position:relative;display:block;width:100%;margin-top:26px;border:0;border-radius:999px;padding:15px;font-family:var(--serif);font-size:18px;background:var(--albero);color:#22160A}
.cta:active{transform:scale(.98)}
.fine{position:relative;text-align:center;color:var(--dim);font-size:12.5px;margin-top:14px}

/* home hero */
.hero{padding-top:calc(18px + env(safe-area-inset-top))}
.hero .plaque{margin:6px 4px 0}
.hero .plaque h1{font-size:52px}
.hero-tiles{height:16px;margin:0 auto;width:calc(100% - 30px);background-image:var(--tile);background-size:34px 34px;opacity:.5;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}

/* lanes */
.lanes{display:grid;gap:10px;margin-top:6px}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 15px;position:relative;overflow:hidden}
.lane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.lane .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--c)}
.lane .who .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lane h3{margin-top:6px}
.lane .meta{color:var(--dim);font-size:13px;margin-top:2px}
.bar{height:5px;background:#0A1330;border-radius:5px;margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:5px}
.next{font-size:13px;color:var(--dim)}
.next b{color:var(--cal);font-weight:600}
.t-together{--c:var(--albero)} .t-work{--c:var(--cobalt-soft)} .t-explore{--c:var(--coral)}
.count{display:flex;gap:10px;margin-top:10px}
.count div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center;padding:12px 4px}
.count b{display:block;font:400 30px/1 var(--serif);color:var(--albero)}
.count span{font-size:12px;color:var(--dim)}

/* day tiles */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dtile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 10px;text-align:left;position:relative}
.dtile b{display:block;font:400 18px/1.1 var(--serif)}
.dtile span{display:block;color:var(--dim);font-size:12px;margin-top:4px;line-height:1.3}
.dtile[aria-pressed=true]{background:var(--cal);color:var(--tile-ink);border-color:var(--cal)}
.dtile[aria-pressed=true] span{color:#2c4f9c}

/* sticky bars */
.sticky{position:sticky;top:0;z-index:5;background:linear-gradient(var(--night) 82%,transparent);padding:calc(14px + env(safe-area-inset-top)) 0 12px;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--deep);color:var(--dim);padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px}
.chip[aria-pressed=true]{background:var(--cal);color:var(--tile-ink);border-color:var(--cal)}
.chip .d{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.dayline{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;margin:12px 0 6px}
.dayline b{color:var(--cal);font-weight:600}

/* timeline */
.blk{display:grid;grid-template-columns:46px 14px 1fr;column-gap:10px}
.time{text-align:right;padding-top:14px;font-variant-numeric:tabular-nums;line-height:1.2}
.time b{display:block;font-size:14.5px}
.time span{color:var(--dim);font-size:12px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.rail i{position:absolute;left:0;top:18px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--night)}
.blk.done .rail i{background:var(--night);border:2px solid var(--c)}
.card{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 8px}
.blk.done .card{opacity:.55}
.card .head{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}
.card .head span{display:block}
.card .lbl{font-size:12px;font-weight:700;color:var(--c)}
.card .ttl{font:400 17px/1.25 var(--serif);margin-top:2px}
.card .place{color:var(--dim);font-size:13px;margin-top:2px}
.card .teaser{margin-top:8px;font-size:14px;color:#dbe3f6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .teaser{display:block;-webkit-line-clamp:unset}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.card.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.opts{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.opts li{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px}
.opts li b{color:var(--cal)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--deep);border:1px solid var(--line);color:var(--dim)}
.tag.book{background:rgba(214,87,62,.18);border-color:var(--almagre);color:var(--coral)}
.tag.gem{background:rgba(228,170,60,.16);border-color:var(--albero);color:var(--albero)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--deep);color:var(--cal);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--albero);color:#22160A;border-color:var(--albero)}
.btn:active{transform:scale(.97)}
.empty{color:var(--dim);text-align:center;padding:26px 0}

/* generic cards / lists */
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px}
.box h3{margin-bottom:4px}
.box.gold{border-color:var(--albero)}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{flex:none;min-width:98px;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;color:var(--albero);font-size:13.5px}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.check:first-of-type{border-top:0}
.check .bx{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--cobalt);display:grid;place-items:center;margin-top:1px}
.check[aria-checked=true] .bx{background:var(--ok);border-color:var(--ok)}
.check[aria-checked=true] .bx::after{content:"";width:6px;height:11px;border:solid #0A1330;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-checked=true] span.tx{opacity:.6;text-decoration:line-through}
.check small{display:block;color:var(--dim)}
details.acc{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details.acc summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:20px;color:var(--albero);transition:transform .2s}
details.acc[open] summary::after{transform:rotate(45deg)}
details.acc .in{padding:0 15px 13px;color:#dbe3f6;font-size:14px}
details.acc .in li{margin-bottom:6px}
details.acc ul{padding-left:18px;margin:0}

/* eat */
.seg{display:flex;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--dim);font-weight:600;padding:9px 4px;border-radius:9px;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--cal);color:var(--tile-ink)}
.dish{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px}
.dish h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dish h3 small{font:600 12px var(--sans);color:var(--coral);white-space:nowrap}
.dish p{color:#dbe3f6;font-size:14px;margin:6px 0 0}
.dish .ask{margin-top:8px;font-size:13px;color:var(--albero)}
.wk{display:flex;gap:6px;margin-top:10px}
.wk span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;background:rgba(134,194,138,.16);color:var(--ok);border:1px solid rgba(134,194,138,.4)}
.wk span.no{background:rgba(214,87,62,.14);color:var(--coral);border-color:rgba(214,87,62,.5);text-decoration:line-through}
.hrs{font-size:12.5px;color:var(--dim);margin-top:8px}

/* map */
#map{height:min(46dvh,420px);border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--deep)}
.leaflet-container{font-family:var(--sans);background:var(--deep)}
.pin{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid var(--night);box-shadow:0 2px 6px #0009}
.pin.on{width:24px;height:24px}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--cal);border-radius:12px;border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.4}
.leaflet-popup-content b{font-family:var(--serif);font-weight:400;font-size:16px;display:block;margin-bottom:2px}
.leaflet-popup-content a{color:var(--albero);font-weight:600}
.cat-sight{--c:var(--albero)} .cat-eat{--c:var(--almagre)} .cat-culture{--c:var(--cobalt-soft)} .cat-sweet{--c:var(--rose)} .cat-shop{--c:var(--cobalt)} .cat-base{--c:var(--ok)}
.plist button.item{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:11px 0}
.plist .sw{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.plist small{display:block;color:var(--dim)}
.offline{background:var(--deep);border:1px dashed var(--line);border-radius:16px;padding:10px}
.offline svg{width:100%;height:auto;display:block}
.offline text{font:600 9px var(--sans);fill:var(--dim)}

/* toast */
#toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--cal);color:var(--tile-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

select,input[type=time]{background:var(--deep);border:1px solid var(--line);color:var(--cal);border-radius:10px;padding:9px 10px;font:inherit}
.msg{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13.5px;color:#dbe3f6;margin:8px 0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash::before{opacity:.55}}
@media (min-width:700px){#app{margin:14px auto;height:calc(100dvh - 28px);border-radius:28px}}

</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="nav" aria-label="Sections"></nav>
  <div id="splash">
    <div class="plaque">
      <h1>Sevilla</h1>
      <div class="ln">28 to 30 September 2026</div>
      <div class="ln2">Two travellers, one flight home at 22:00</div>
    </div>
    <button class="cta" id="enter">Open the guide</button>
    <div class="fine">Follows Madrid time. Tap any card for detail.</div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------- Trip data (hours checked on Google Maps, 28 Sep 2026) ---------- */
const DAYS = [
  {name:'Monday', short:'Mon 28', theme:'Landings and first tapas', line:'Two arrivals, one work day, a floodlit night.'},
  {name:'Tuesday', short:'Tue 29', theme:'The big day', line:'Alcázar, Cathedral, flamenco and a very late night.'},
  {name:'Wednesday', short:'Wed 30', theme:'Triana and last bites', line:'Tiles, market, a local lunch, then the 22:00 flight.'}
];
const SUN = ['08:16','20:12'];

const TRACKS = {
  together:{label:'Together', cls:'t-together'},
  work:{label:'Working', cls:'t-work'},
  explore:{label:'Exploring', cls:'t-explore'}
};

const CATS = {
  sight:'Sights', eat:'Eat and drink', culture:'Flamenco and art', sweet:'Sweets', shop:'Souvenirs', base:'Base and work'
};

/* key, name, cat, lat, lng, place_id, blurb, hours */
const PINS = [
  {k:'base', n:'Plaza del Salvador (your base area)', c:'base', la:37.38999, ln:-5.99284, b:'Minarete del Salvador sits between here and Alfalfa.', h:''},
  {k:'late', n:'LATE. Specialty Coffee & co working', c:'base', la:37.39614, ln:-5.99414, id:'ChIJM7YsquZtEg0RoEr9g59svFg', b:'Small co-working cafe with reported WiFi. Calle Amor de Dios 36.', h:'Mon 08:30–18:30, Tue–Wed 08:30–17:30'},
  {k:'syra', n:'Syra Coffee', c:'base', la:37.38894, ln:-5.99331, id:'ChIJEWLhqdttEg0RpLD4sByPpg8', b:'Great coffee, tiny, close to the flat. Better for a coffee than a work session.', h:'Mon–Fri 08:00–20:00'},
  {k:'hispalis', n:'Hispalis Café', c:'base', la:37.39358, ln:-5.99478, id:'ChIJP20czzNtEg0RZZbZI7N_2I0', b:'Roastery on Calle Amor de Dios 1. Can queue.', h:'Daily 08:30–15:00'},
  {k:'alcazar', n:'Real Alcázar', c:'sight', la:37.38305, ln:-5.99023, id:'ChIJS6JBjBlsEg0Rh_7Brr92qbo', b:'Mudéjar palace and gardens. Book a timed slot.', h:'Daily 09:30–19:00'},
  {k:'cathedral', n:'Cathedral and Giralda', c:'sight', la:37.38618, ln:-5.99261, id:'ChIJK9S3HhpsEg0RR3Jr5EfWT50', b:'Ticket also covers the Iglesia del Salvador.', h:'Mon–Sat about 10:45–19:00, last entry about 18:00'},
  {k:'salvador', n:'Iglesia del Divino Salvador', c:'sight', la:37.38999, ln:-5.99284, id:'ChIJa8bQvBpsEg0RuSzRTLicWAs', b:'Gilded Baroque altarpieces on your doorstep, built over the old main mosque.', h:'Included in the Cathedral ticket'},
  {k:'setas', n:'Setas de Sevilla (Metropol Parasol)', c:'sight', la:37.39298, ln:-5.99216, id:'ChIJH1SaEAVsEg0RxNL-4W2upL0', b:'Wooden rooftop walk, best around sunset.', h:'Daily 09:30–23:45'},
  {k:'torre', n:'Torre del Oro', c:'sight', la:37.38236, ln:-5.99639, b:'Riverside tower on the Guadalquivir.', h:'Exterior always open'},
  {k:'plaza', n:'Plaza de España and Parque de María Luisa', c:'sight', la:37.37418, ln:-5.98722, id:'ChIJ7zUaHSRsEg0RQugeffDytmg', b:'Brick and tile semicircle with provincial alcoves. Golden hour is the moment.', h:'Sunset about 20:12'},
  {k:'pilatos', n:'Casa de Pilatos', c:'culture', la:37.38999, ln:-5.98721, id:'ChIJNbFm6xxsEg0Rq59iZILsBgo', b:'Tiled courtyards and Roman statues, far quieter than the Alcázar.', h:'Daily 09:00–18:00'},
  {k:'bellas', n:'Museo de Bellas Artes', c:'culture', la:37.39251, ln:-6.00003, id:'ChIJp_IY2w1sEg0RNLww11Nc7LM', b:'Murillo, Zurbarán and Valdés Leal in a former convent. €1.50 cash for non-EU visitors.', h:'Tue–Sat 09:00–21:00, closed Mon'},
  {k:'sanluis', n:'Iglesia de San Luis de los Franceses', c:'culture', la:37.39841, ln:-5.98811, id:'ChIJnyEZNAFsEg0RYuZ5iJqoSvM', b:'Jesuit Baroque church, quiet and rarely crowded.', h:'Tue–Sun 10:00–14:00 and 16:00–20:00'},
  {k:'casaflamenco', n:'La Casa del Flamenco', c:'culture', la:37.38630, ln:-5.98859, id:'ChIJtwrN_RtsEg0R0er6ftofp4M', b:'Intimate one-hour flamenco show in a Santa Cruz courtyard.', h:'Shows in the evening, book ahead'},
  {k:'carboneria', n:'La Carbonería', c:'culture', la:37.38787, ln:-5.98711, id:'ChIJBWiuZxxsEg0RfiYITcSxxew', b:'Former coal warehouse with free flamenco and a patio bar. No photos.', h:'Evening shows'},
  {k:'anselma', n:'Antigua Casa Anselma (Triana)', c:'culture', la:37.38463, ln:-6.00576, id:'ChIJQdayHcltEg0RyyygS6SS7NQ', b:'Late-night bar where flamenco erupts from about midnight.', h:'Music from about 00:30'},

function madridNow() {
  if (state.preview != null) return state.preview;
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const g = t => +parts.find(p => p.type === t).value;
  const dayIdx = Math.round((Date.UTC(g('year'), g('month') - 1, g('day')) - TRIP0) / 86400000);
  return dayIdx * 1440 + g('hour') * 60 + g('minute');
}

function starPts(cx, cy, ro, ri, n) {
  const a = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro, ang = Math.PI * i / n - Math.PI / 2;
    a.push((cx + r * Math.cos(ang)).toFixed(1) + ',' + (cy + r * Math.sin(ang)).toFixed(1));
  }
  return a.join(' ');
}

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Copied'); }
  catch (e) {

/* ---------- NOW ---------- */
function laneState(lane, t) {
  const L = BLOCKS.filter(b => b.k === 'together' || b.k === lane).sort((a, b) => a.a0 - b.a0);
  return { cur: L.find(b => t >= b.a0 && t < b.a1), nxt: L.find(b => b.a0 > t) };
}
function nextLine(b, t) {
  if (!b) return '<div class="next">Nothing more planned in this lane.</div>';
  const mins = b.a0 - t, h = Math.floor(mins / 60), m = mins % 60;
  const when = mins < 1 ? 'now' : (h ? h + ' h ' : '') + (m ? m + ' min' : '');
  return '<div class="next">Next in ' + when.trim() + ': <b>' + b.t + '</b> at ' + fmt(b.a0) + '</div>';
}
function laneCard(label, cls, cur, nxt, t, onlyNext) {
  let body;
  if (cur && !onlyNext) {
    const pct = Math.max(2, Math.min(100, Math.round((t - cur.a0) / (cur.a1 - cur.a0) * 100)));
    body = '<h3>' + cur.t + '</h3><div class="meta tnum">' + fmt(cur.a0) + '–' + fmt(cur.a1) + ' at ' + cur.p + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  } else if (onlyNext && nxt) {
    body = '<h3>' + nxt.t + '</h3><div class="meta tnum">' + fmt(nxt.a0) + ' at ' + nxt.p + '</div><div style="height:8px"></div>';
  } else {
    body = '<h3>Free time</h3><div class="meta">A gap in this lane. Wander, rest or eat.</div><div style="height:8px"></div>';
  }
  return '<section class="lane ' + cls + '"><div class="who"><span class="dot"></span>' + label + '</div>' + body + (onlyNext ? '' : nextLine(nxt, t)) + '</section>';
}

  } else if (state.eat === 'places') {
    body = '<p class="sub" style="margin:14px 0 12px">Hours were checked for your three days. Red means closed that day.</p>' +
      EAT.map(e => {
        const p = pin(e.k);
        return '<div class="dish"><h3>' + p.n + '<small>' + e.price + ' ' + e.area + '</small></h3><p><b>Order:</b> ' + e.order + '.</p><p style="color:var(--dim)">' + e.note + '</p>' +
          '<div class="wk">' + ['Mon', 'Tue', 'Wed'].map((d, i) => '<span class="' + (e.hrs[i] ? '' : 'no') + '">' + d + '</span>').join('') + '</div>' +
          '<div class="hrs tnum">' + p.h + '</div><div class="acts"><a class="btn pri" target="_blank" rel="noopener" href="' + mapsUrl(p) + '">Open in Maps</a><button class="btn" data-a="showpin" data-v="' + p.k + '">Show on map</button></div></div>';
      }).join('');
  } else {
    body = '<h2>Sweets</h2>' + SWEETS.map(s => '<div class="dish"><h3>' + s.n + '</h3><p>' + s.d + '</p></div>').join('') +
      '<div class="acts" style="margin:-2px 0 6px"><button class="btn" data-a="showpin" data-v="sanleandro">Show San Leandro on map</button></div>' +
      '<h2>Sips</h2>' + DRINKS.map(s => '<div class="dish"><h3>' + s.n + '</h3><p>' + s.d + '</p></div>').join('');
  }
  return '<div class="screen"><div class="sticky"><div class="seg">' + segs.map(s => '<button data-a="eat" data-v="' + s[0] + '" aria-pressed="' + (state.eat === s[0]) + '">' + s[1] + '</button>').join('') + '</div></div>' + body + '</div>';
}

/* ---------- SHOP ---------- */
function viewShop() {
  const cards = SOUVENIRS.map(s => {
    const shops = s.shops.map(k => pin(k)).filter(Boolean);
    const shopList = shops.map(p =>
      '<li><b>' + p.n + '.</b> ' + p.b + (p.h ? ' <span style="color:var(--dim)">(' + p.h + ')</span>' : '') +
      '<div class="acts" style="margin-top:6px"><a class="btn pri" target="_blank" rel="noopener" href="' + mapsUrl(p) + '">Open in Maps</a><button class="btn" data-a="showpin" data-v="' + p.k + '">Show on map</button></div></li>'
    ).join('');
    return '<div class="dish"><h3>' + s.n + '<small>' + s.price + '</small></h3><p>' + s.d + '</p>' +
      '<div class="ask">Tip: ' + s.tip + '</div><ul class="opts" style="margin-top:10px">' + shopList + '</ul></div>';
  }).join('');
  return '<div class="screen"><h2 style="margin-top:calc(22px + env(safe-area-inset-top))">Souvenirs worth buying</h2>' +
    '<p class="sub">Traditional, locally made items, with shops chosen for craft over volume. Prices are indicative, expect some variation by size and detail.</p>' + cards + '</div>';
}

/* ---------- MAP ---------- */
let map = null, group = null, markers = {};
const catColor = { sight: '#E4AA3C', eat: '#D6573E', culture: '#93B3F8', sweet: '#F0A6C0', base: '#86C28A' };
function visiblePins() { return PINS.filter(p => state.mapCat === 'all' || p.c === state.mapCat); }
function popup(p) { return '<b>' + p.n + '</b>' + p.b + (p.h ? '<br><span style="color:#B4BFDD">' + p.h + '</span>' : '') + '<br><a target="_blank" rel="noopener" href="' + mapsUrl(p) + '">Open in Google Maps</a>'; }
function viewMap() {
  const cats = [['all', 'All']].concat(Object.entries(CATS));
  const list = visiblePins().filter(p => p.k !== 'airport' && p.k !== 'salvador');
  const simple = state.mapMode === 'simple';
  const mapArea = simple
    ? offlineMap(visiblePins()) + '<div class="acts" style="margin-top:10px"><button class="btn pri" data-a="maptry">Try the live map again</button></div>'
    : '<div id="map" role="region" aria-label="Map of places"></div><div class="acts" style="margin-top:8px"><button class="btn" data-a="mapsimple">Map not loading? Use a simple layout</button></div>';
  return '<div class="screen"><div class="sticky"><div class="chips">' + cats.map(c => '<button class="chip" data-a="mapcat" data-v="' + c[0] + '" aria-pressed="' + (state.mapCat === c[0]) + '">' + c[1] + '</button>').join('') + '</div></div>' +
    mapArea +
    '<div class="plist" style="margin-top:8px">' + list.map(p => '<button class="item cat-' + p.c + '" data-a="focus" data-v="' + p.k + '"><span class="sw"></span><span><b style="font-weight:600">' + p.n + '</b><small>' + p.b + '</small></span></button>').join('') + '</div></div>';
}
function offlineMap(pins) {
  const pts = pins.filter(p => p.k !== 'airport'), cosl = Math.cos(37.39 * Math.PI / 180);
  const xs = pts.map(p => p.ln * cosl), ys = pts.map(p => -p.la);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), W = 340, H = 360, pad = 26;
  const sc = Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad) / (y1 - y0 || 1));
  const g = pts.map((p, i) => { const x = pad + (xs[i] - x0) * sc, y = pad + (ys[i] - y0) * sc; return '<g class="cat-' + p.c + '"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" style="fill:var(--c)"/><text x="' + (x + 7).toFixed(1) + '" y="' + (y + 3).toFixed(1) + '">' + p.n.split(/[ (,]/)[0] + ' ' + (p.n.split(/[ (,]/)[1] || '') + '</text></g>'; }).join('');
  return '<div class="offline"><div class="sub" style="padding:2px 4px 8px">Street map unavailable offline. This is a simple layout of your places, north is up.</div><svg viewBox="0 0 ' + W + ' ' + H + '">' + g + '</svg></div>';
}
function initMap() {
  const host = $('#map'); if (!host) return;
  if (!window.L) { state.mapMode = 'simple'; render(true); return; }
  if (map) { map.remove(); map = null; }
  map = L.map('map', { zoomControl: false }).setView([37.3886, -5.9925], 14);
  L.control.zoom({ position: 'topright' }).addTo(map);
  const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
  let loaded = false, errors = 0;
  tiles.on('tileload', () => { loaded = true; });
  tiles.on('tileerror', () => { errors++; });
  setTimeout(() => {
    if (!loaded && errors > 0 && state.tab === 'map' && state.mapMode === 'auto') {
      state.mapMode = 'simple'; render(true);
      toast('Map tiles blocked on this network — showing a simple layout');
    }
  }, 4500);
  group = L.layerGroup().addTo(map); markers = {};
  visiblePins().filter(p => p.k !== 'airport').forEach(p => {
    const m = L.marker([p.la, p.ln], { icon: L.divIcon({ className: '', html: '<div class="pin cat-' + p.c + '"></div>', iconSize: [18, 18], iconAnchor: [9, 18], popupAnchor: [0, -16] }) }).bindPopup(popup(p));
    m.addTo(group); markers[p.k] = m;
  });
  if (state.focus) { focusPin(state.focus, true); state.focus = null; }
}
function focusPin(k, fromInit) {
  const p = pin(k); if (!p) return;
  if (state.mapMode === 'simple') { toast(p.n); return; }
  if (!map) return;
  if (!markers[k]) { state.mapCat = 'all'; state.focus = k; render(true); return; }
  map.setView([p.la, p.ln], 16); markers[k].openPopup();
  if (!fromInit) main.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- KNOW ---------- */
function viewKnow() {
  return '<div class="screen"><h2 style="margin-top:calc(22px + env(safe-area-inset-top))">Know before you go</h2><p class="sub">Small local habits that make the days easier and better.</p>' +
    '<details class="acc" open><summary>The daily rhythm</summary><div class="in">' + RHYTHM.map(r => '<div class="row"><span class="k">' + r[0] + '</span><span>' + r[1] + '</span></div>').join('') + '</div></details>' +
    '<details class="acc"><summary>Say it in Spanish</summary><div class="in">' + PHRASES.map(r => '<div class="row"><span style="flex:1"><b>' + r[0] + '</b>' + (r[1] ? '<br><span class="sub">' + r[1] + '</span>' : '') + '</span><span class="sub" style="flex:1">' + r[2] + '</span></div>').join('') + '</div></details>' +
    '<details class="acc"><summary>Manners and practicalities</summary><div class="in"><ul>' + ETIQUETTE.map(x => '<li>' + x + '</li>').join('') + '</ul></div></details>' +
    '<details class="acc"><summary>Words worth knowing</summary><div class="in">' + VOCAB.map(r => '<div class="row"><span class="k" style="min-width:96px">' + r[0] + '</span><span>' + r[1] + '</span></div>').join('') + '</div></details>' +
    '<details class="acc"><summary>Walking times from Plaza del Salvador</summary><div class="in">' + WALKS.map(r => '<div class="row"><span style="flex:1">' + r[0] + '</span><span class="k tnum" style="text-align:right">' + r[1] + '</span></div>').join('') + '<p class="sub" style="margin-top:8px">Approximate, from the plaza rather than the exact door of your flat.</p></div></details>' +
    '<p class="sub" style="margin-top:16px">Opening hours were checked on Google Maps on 28 September 2026. Churches and small bars sometimes shift, so confirm on the day.</p></div>';
}

/* ---------- GO ---------- */
function viewGo() {
  const t = madridNow(), d = Math.max(0, Math.min(2, Math.floor(t / 1440)));
  return '<div class="screen"><h2 style="margin-top:calc(22px + env(safe-area-inset-top))">Getting around</h2>' +
    '<div class="box"><h3>Arriving on Monday</h3><p class="sub" style="margin-top:4px">The EA airport bus takes about 35 minutes and costs roughly €4–6, paid to the driver. A taxi from the rank is a fixed fare of about €25–30 and takes 25–30 minutes. Check-in at the flat opens at 15:00.</p></div>' +
    '<div class="box"><h3>Your base</h3><p class="sub" style="margin-top:4px">Minarete del Salvador (Green Apartments), between Plaza del Salvador and Alfalfa. Almost everything on the Plan is within a 15 minute walk. For Plaza de España, Triana at night and the airport, use a taxi or a bus.</p></div>' +
    '<div class="box gold"><h3>Message the host</h3><p class="sub" style="margin-top:4px">Asks about a Monday bag drop, early check-in and holding bags on Wednesday.</p>' +
    '<div class="msg">' + HOST_EN + '</div><div class="acts"><button class="btn pri" data-a="copy" data-v="en">Copy in English</button><button class="btn" data-a="copy" data-v="es">Copiar en español</button></div></div>' +
    '<div class="box"><h3>Leaving on Wednesday</h3><p class="sub" style="margin-top:4px">Leave the flat by 18:45 for a taxi to the airport, arriving about three hours before the 22:00 flight. Confirm the check-out time and bag storage with your host.</p></div>' +
    '<h2>Preview a moment</h2><div class="box"><p class="sub" style="margin-top:0">See what the Now tab will show at any time of the trip.</p>' +
    '<div class="acts" style="margin-top:0"><select id="pvDay" aria-label="Day">' + DAYS.map((x, i) => '<option value="' + i + '"' + (i === d ? ' selected' : '') + '>' + x.short + '</option>').join('') + '</select>' +
    '<input type="time" id="pvTime" value="' + fmt(((t % 1440) + 1440) % 1440) + '" aria-label="Time"><button class="btn pri" data-a="preview">Preview</button><button class="btn" data-a="live">Live</button></div></div>' +
    '<p class="sub">Times follow Madrid time (CEST) so the guide stays right even if your phone is still on UK time.</p></div>';
}

/* ---------- render + events ---------- */
const VIEWS = { now: viewNow, plan: viewPlan, eat: viewEat, shop: viewShop, map: viewMap, know: viewKnow, go: viewGo };
function render(keepScroll) {
  const y = main.scrollTop;
  main.innerHTML = VIEWS[state.tab]();
  main.scrollTop = keepScroll ? y : 0;
  renderNav();
  if (state.tab === 'map' && state.mapMode === 'auto') initMap();
}

const ACTIONS = {
  tab: v => { state.tab = v; render(); },
  gotoday: v => { state.day = +v; state.tab = 'plan'; render(); },
  day: v => { state.day = +v; render(); },
  filter: v => { state.filter = v; render(true); },
  toggle: (v, el) => { state.open[v] = !state.open[v]; el.closest('.card').classList.toggle('open', state.open[v]); el.setAttribute('aria-expanded', state.open[v]); },
  done: v => { state.done[v] = !state.done[v]; store.set('done', state.done); render(true); },
  eat: v => { state.eat = v; render(); },
  mapcat: v => { state.mapCat = v; render(true); },
  focus: v => focusPin(v),
  showpin: v => { state.tab = 'map'; state.focus = v; state.mapCat = 'all'; render(); },
  mapsimple: () => { state.mapMode = 'simple'; render(true); },
  maptry: () => { state.mapMode = 'auto'; render(true); },
  check: v => { state.checks[v] = !state.checks[v]; store.set('checks', state.checks); render(true); },
  copy: v => copyText(v === 'es' ? HOST_ES : HOST_EN),
  preview: () => {
    const d = +$('#pvDay').value, tm = $('#pvTime').value || '12:00';
    state.preview = d * 1440 + toMin(tm); state.tab = 'now'; render();
  },
  live: () => { state.preview = null; render(true); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && ACTIONS[el.dataset.a]) ACTIONS[el.dataset.a](el.dataset.v, el);
});

$('#enter').addEventListener('click', () => {
  const s = $('#splash'); s.classList.add('out'); setTimeout(() => s.remove(), 550);
});

render();
setInterval(() => { if (state.tab === 'now' && !document.hidden && state.preview == null) render(true); }, 60000);

</script>
</body>
